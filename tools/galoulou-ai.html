<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Galoulou AI - Smart Shopping Assistant</title>

    <meta
        name="description"
        content="Search the web and make smarter shopping decisions with Galoulou AI."
    >


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="../style.css"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* =========================================
           PAGE
        ========================================= */

        .tool-page {

            min-height: 100vh;
            padding: 80px 20px;

        }


        .tool-container {

            max-width: 1000px;
            margin: 0 auto;

        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 45px;

            color: var(--text-secondary);
            text-decoration: none;

            transition: 0.2s ease;

        }


        .back-button:hover {

            color: var(--text);
            transform: translateX(-3px);

        }


        /* =========================================
           HEADER
        ========================================= */

        .ai-header {

            text-align: center;
            margin-bottom: 45px;

        }


        .ai-icon {

            width: 78px;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 22px;

            background: var(--button);
            color: var(--button-text);

            font-size: 30px;

        }


        .ai-header h1 {

            margin: 0 0 12px;

            font-size: clamp(42px, 8vw, 75px);

            letter-spacing: -4px;

        }


        .ai-header h1 span {

            color: var(--text-secondary);

        }


        .ai-header p {

            margin: 0;

            color: var(--text-secondary);

            font-size: 17px;

        }


        /* =========================================
           AI CARD
        ========================================= */

        .ai-card {

            padding: 30px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 24px;

        }


        /* =========================================
           SEARCH BOX
        ========================================= */

        .search-box {

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 10px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);

            border-radius: 18px;

            transition: 0.2s ease;

        }


        .search-box:focus-within {

            border-color: var(--border-hover);

        }


        .search-box textarea {

            flex: 1;

            min-height: 55px;
            max-height: 160px;

            padding: 14px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            font-family: inherit;

            font-size: 16px;

            line-height: 1.5;

        }


        .ask-button {

            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: none;

            border-radius: 14px;

            background: var(--button);

            color: var(--button-text);

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .ask-button:hover:not(:disabled) {

            transform: scale(1.05);

        }


        .ask-button:disabled {

            opacity: 0.6;
            cursor: not-allowed;

        }


        /* =========================================
           SUGGESTIONS
        ========================================= */

        .suggestions {

            margin-top: 20px;

        }


        .suggestions-title {

            margin-bottom: 12px;

            color: var(--text-secondary);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .suggestion-buttons {

            display: flex;
            flex-wrap: wrap;
            gap: 8px;

        }


        .suggestion {

            padding: 10px 14px;

            border: 1px solid var(--border);

            border-radius: 100px;

            background: transparent;

            color: var(--text-secondary);

            font-family: inherit;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .suggestion:hover {

            color: var(--text);

            background: var(--bg-secondary);

            border-color: var(--border-hover);

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            display: none;

            padding: 50px 20px;

            text-align: center;

        }


        .loading.show {

            display: block;

        }


        .loading i {

            font-size: 30px;
            margin-bottom: 16px;

        }


        .loading p {

            margin: 0;

            color: var(--text-secondary);

        }


        /* =========================================
           RESPONSE
        ========================================= */

        .ai-response {

            display: none;

            margin-top: 30px;

            animation: appear 0.35s ease;

        }


        .ai-response.show {

            display: block;

        }


        @keyframes appear {

            from {

                opacity: 0;
                transform: translateY(10px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }


        /* =========================================
           AI MESSAGE
        ========================================= */

        .ai-message {

            padding: 24px;

            margin-bottom: 18px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);

            border-radius: 18px;

        }


        .message-top {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;

        }


        .message-avatar {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: var(--button);

            color: var(--button-text);

        }


        .message-name {

            font-weight: 700;

        }


        .message-text {

            margin: 0;

            color: var(--text-secondary);

            line-height: 1.7;

            white-space: pre-wrap;

        }


        /* =========================================
           RECOMMENDATIONS
        ========================================= */

        .recommendations {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 14px;

            margin-bottom: 25px;

        }


        .recommendation {

            padding: 20px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 18px;

            transition: 0.2s ease;

        }


        .recommendation:hover {

            transform: translateY(-4px);

            border-color: var(--border-hover);

        }


        .recommendation-icon {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            background: var(--bg-secondary);

            border-radius: 12px;

            font-size: 20px;

        }


        .recommendation h3 {

            margin: 0 0 8px;

            font-size: 15px;

        }


        .recommendation p {

            margin: 0;

            color: var(--text-secondary);

            font-size: 13px;

            line-height: 1.6;

        }


        /* =========================================
           WEB RESULTS
        ========================================= */

        .results-section {

            margin-top: 25px;

        }


        .results-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;

            font-size: 15px;

        }


        .web-results {

            display: grid;

            gap: 12px;

        }


        .web-result {

            display: block;

            padding: 18px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);

            border-radius: 16px;

            text-decoration: none;

            color: inherit;

            transition: 0.2s ease;

        }


        .web-result:hover {

            transform: translateY(-3px);

            border-color: var(--border-hover);

        }


        .web-result-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 8px;

        }


        .web-result h3 {

            margin: 0;

            font-size: 15px;

        }


        .web-result-icon {

            color: var(--text-secondary);

        }


        .web-result p {

            margin: 0 0 10px;

            color: var(--text-secondary);

            font-size: 13px;

            line-height: 1.5;

        }


        .result-domain {

            color: var(--text-secondary);

            font-size: 12px;

            opacity: 0.8;

        }


        /* =========================================
           STATUS
        ========================================= */

        .ai-status {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 30px;

            color: var(--text-secondary);

            font-size: 12px;

        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #4caf50;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .tool-page {

                padding: 55px 16px;

            }


            .ai-card {

                padding: 20px;

            }


            .recommendations {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 500px) {

            .ai-header h1 {

                letter-spacing: -2px;

            }


            .suggestion-buttons {

                flex-direction: column;

            }


            .suggestion {

                width: 100%;

                text-align: left;

            }


            .search-box {

                align-items: flex-end;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a
            href="../index.html"
            class="logo"
        >

            <img
                src="../assets/galouloutoolbox.png"
                alt="Galoulou Toolbox Logo"
            >

            <span>Galoulou Toolbox</span>

        </a>


        <a
            href="../index.html#tools"
            class="discord-button"
        >

            <i class="fa-solid fa-arrow-left"></i>

            All Tools

        </a>

    </header>


    <!-- MAIN -->

    <main class="tool-page">

        <div class="tool-container">


            <a
                href="../index.html"
                class="back-button"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Toolbox

            </a>


            <!-- HEADER -->

            <section class="ai-header">

                <div class="ai-icon">

                    <i class="fa-solid fa-sparkles"></i>

                </div>


                <h1>

                    Galoulou

                    <span>AI</span>

                </h1>


                <p>

                    Search the web and make smarter shopping decisions.

                </p>

            </section>


            <!-- AI CARD -->

            <section class="ai-card">


                <!-- SEARCH -->

                <div class="search-box">

                    <textarea
                        id="aiInput"
                        placeholder="What are you looking to buy?"
                        maxlength="2000"
                    ></textarea>


                    <button
                        class="ask-button"
                        id="askButton"
                        title="Ask Galoulou AI"
                    >

                        <i class="fa-solid fa-arrow-up"></i>

                    </button>

                </div>


                <!-- SUGGESTIONS -->

                <div class="suggestions">

                    <p class="suggestions-title">

                        TRY ASKING

                    </p>


                    <div class="suggestion-buttons">

                        <button class="suggestion">
                            Where can I buy a Wooting 60HE?
                        </button>

                        <button class="suggestion">
                            Find the best gaming mouse under €100
                        </button>

                        <button class="suggestion">
                            Where should I buy a PS5?
                        </button>

                    </div>

                </div>


                <!-- LOADING -->

                <div
                    class="loading"
                    id="loading"
                >

                    <i class="fa-solid fa-magnifying-glass fa-bounce"></i>

                    <p id="loadingText">

                        Searching the web...

                    </p>

                </div>


                <!-- RESPONSE -->

                <div
                    class="ai-response"
                    id="aiResponse"
                >


                    <!-- AI ANSWER -->

                    <div class="ai-message">

                        <div class="message-top">

                            <div class="message-avatar">

                                <i class="fa-solid fa-sparkles"></i>

                            </div>


                            <span class="message-name">

                                Galoulou AI

                            </span>

                        </div>


                        <p
                            class="message-text"
                            id="responseText"
                        ></p>

                    </div>


                    <!-- RECOMMENDATIONS -->

                    <div class="recommendations">


                        <div class="recommendation">

                            <div class="recommendation-icon">
                                🏆
                            </div>

                            <h3>Best Choice</h3>

                            <p id="bestChoice"></p>

                        </div>


                        <div class="recommendation">

                            <div class="recommendation-icon">
                                💰
                            </div>

                            <h3>Best Price</h3>

                            <p id="bestPrice"></p>

                        </div>


                        <div class="recommendation">

                            <div class="recommendation-icon">
                                🛡️
                            </div>

                            <h3>Safest Option</h3>

                            <p id="safeChoice"></p>

                        </div>


                    </div>


                    <!-- REAL WEB RESULTS -->

                    <section class="results-section">

                        <h2 class="results-title">

                            <i class="fa-solid fa-globe"></i>

                            Web results

                        </h2>


                        <div
                            class="web-results"
                            id="webResults"
                        ></div>

                    </section>


                </div>


                <!-- STATUS -->

                <div class="ai-status">

                    <span class="status-dot"></span>

                    Live web search • Galoulou AI

                </div>


            </section>


        </div>

    </main>


    <script>

        // =========================================
        // CONFIGURATION
        // =========================================

        const WORKER_URL =
            "https://galoulou-ai.twitchgaloulou.workers.dev/";


        // =========================================
        // ELEMENTS
        // =========================================

        const aiInput =
            document.getElementById("aiInput");

        const askButton =
            document.getElementById("askButton");

        const loading =
            document.getElementById("loading");

        const loadingText =
            document.getElementById("loadingText");

        const aiResponse =
            document.getElementById("aiResponse");

        const responseText =
            document.getElementById("responseText");

        const bestChoice =
            document.getElementById("bestChoice");

        const bestPrice =
            document.getElementById("bestPrice");

        const safeChoice =
            document.getElementById("safeChoice");

        const webResults =
            document.getElementById("webResults");


        // =========================================
        // LOADING MESSAGES
        // =========================================

        const loadingMessages = [

            "Searching the web... 🔎",

            "Finding the best options... 🛒",

            "Comparing results... 💰",

            "Checking trusted sources... 🛡️"

        ];

        let loadingInterval;


        function startLoadingMessages() {

            let index = 0;

            loadingText.textContent =
                loadingMessages[index];


            loadingInterval = setInterval(

                () => {

                    index =
                        (index + 1) %
                        loadingMessages.length;


                    loadingText.textContent =
                        loadingMessages[index];

                },

                1200

            );

        }


        function stopLoadingMessages() {

            clearInterval(
                loadingInterval
            );

        }


        // =========================================
        // ASK AI
        // =========================================

        async function askAI() {

            const question =
                aiInput.value.trim();


            if (!question) {

                aiInput.focus();

                return;

            }


            // Reset UI

            aiResponse.classList.remove("show");

            webResults.innerHTML = "";


            // Disable input

            askButton.disabled = true;

            aiInput.disabled = true;


            askButton.innerHTML =
                `<i class="fa-solid fa-spinner fa-spin"></i>`;


            // Show loading

            loading.classList.add("show");

            startLoadingMessages();


            try {


                // =========================================
                // CALL WORKER
                // =========================================

                const response = await fetch(

                    WORKER_URL,

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        // IMPORTANT:
                        // Worker expects "question"

                        body: JSON.stringify({

                            question: question

                        })

                    }

                );


                const data =
                    await response.json();


                // =========================================
                // ERROR CHECK
                // =========================================

                if (!response.ok) {

                    throw new Error(

                        data.error ||

                        "Server error."

                    );

                }


                if (data.success === false) {

                    throw new Error(

                        data.error ||

                        "Galoulou AI couldn't complete the search."

                    );

                }


                // =========================================
                // MAIN ANSWER
                // =========================================

                responseText.textContent =

                    data.answer ||

                    "I found some results for your search.";


                // =========================================
                // SMART RECOMMENDATIONS
                // =========================================

                bestChoice.textContent =

                    data.bestChoice ||

                    "Check the first recommended result.";


                bestPrice.textContent =

                    data.bestPrice ||

                    "Compare the available prices in the results.";


                safeChoice.textContent =

                    data.safeChoice ||

                    "Prefer official stores and trusted retailers.";


                // =========================================
                // WEB RESULTS
                // =========================================

                if (

                    Array.isArray(data.results) &&

                    data.results.length > 0

                ) {

                    data.results.forEach(

                        result => {

                            const link =
                                document.createElement("a");


                            link.className =
                                "web-result";


                            link.href =
                                result.url;


                            link.target =
                                "_blank";


                            link.rel =
                                "noopener noreferrer";


                            // Get domain safely

                            let domain =
                                result.url;


                            try {

                                domain =
                                    new URL(
                                        result.url
                                    ).hostname;

                            } catch {

                                // Keep original value

                            }


                            link.innerHTML = `

                                <div class="web-result-top">

                                    <h3>
                                        ${escapeHTML(
                                            result.title ||
                                            "Web result"
                                        )}
                                    </h3>

                                    <i class="fa-solid fa-arrow-up-right-from-square web-result-icon"></i>

                                </div>

                                <p>
                                    ${escapeHTML(
                                        shortenText(
                                            result.content ||
                                            "No description available.",
                                            240
                                        )
                                    )}
                                </p>

                                <span class="result-domain">
                                    ${escapeHTML(domain)}
                                </span>

                            `;


                            webResults.appendChild(
                                link
                            );

                        }

                    );


                } else {

                    webResults.innerHTML = `

                        <div class="web-result">

                            <p>
                                No web results were found for this search.
                            </p>

                        </div>

                    `;

                }


                // =========================================
                // SHOW ANSWER
                // =========================================

                aiResponse.classList.add("show");


                // Clear input

                aiInput.value = "";

                aiInput.style.height = "auto";


                // Scroll to answer

                setTimeout(

                    () => {

                        aiResponse.scrollIntoView({

                            behavior: "smooth",

                            block: "nearest"

                        });

                    },

                    100

                );


            } catch (error) {


                console.error(
                    "Galoulou AI Error:",
                    error
                );


                responseText.textContent =

                    "⚠️ Galoulou AI couldn't complete the web search right now. Please try again.";


                bestChoice.textContent =
                    "Search unavailable";

                bestPrice.textContent =
                    "Please try again";

                safeChoice.textContent =
                    "Check your connection";


                webResults.innerHTML = "";


                aiResponse.classList.add("show");


            } finally {


                // Stop loading

                stopLoadingMessages();


                loading.classList.remove("show");


                // Re-enable

                askButton.disabled = false;

                aiInput.disabled = false;


                askButton.innerHTML =

                    `<i class="fa-solid fa-arrow-up"></i>`;


                aiInput.focus();

            }

        }


        // =========================================
        // HELPERS
        // =========================================

        function shortenText(text, maxLength) {

            if (text.length <= maxLength) {

                return text;

            }

            return (
                text.substring(
                    0,
                    maxLength
                ) + "..."
            );

        }


        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.textContent = text;


            return div.innerHTML;

        }


        // =========================================
        // SEND BUTTON
        // =========================================

        askButton.addEventListener(

            "click",

            askAI

        );


        // =========================================
        // SUGGESTIONS
        // =========================================

        document
            .querySelectorAll(".suggestion")
            .forEach(

                button => {

                    button.addEventListener(

                        "click",

                        () => {

                            aiInput.value =
                                button.textContent.trim();


                            askAI();

                        }

                    );

                }

            );


        // =========================================
        // ENTER TO SEND
        // =========================================

        aiInput.addEventListener(

            "keydown",

            event => {

                if (

                    event.key === "Enter" &&

                    !event.shiftKey

                ) {

                    event.preventDefault();

                    askAI();

                }

            }

        );


        // =========================================
        // AUTO RESIZE
        // =========================================

        aiInput.addEventListener(

            "input",

            () => {

                aiInput.style.height =
                    "auto";


                aiInput.style.height =

                    Math.min(

                        aiInput.scrollHeight,

                        160

                    ) + "px";

            }

        );


        // =========================================
        // AUTO FOCUS
        // =========================================

        aiInput.focus();


        // =========================================
        // CONSOLE
        // =========================================

        console.log(

            "%c🤖 Galoulou AI • Live Web Search Connected!",

            "font-size: 16px; font-weight: bold;"

        );

    </script>

</body>

</html>
