<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro — Galoulou Toolbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0d12;
            --card: #151922;
            --card2: #1b202b;
            --text: #ffffff;
            --muted: #9299a8;
            --border: rgba(255,255,255,0.09);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            background:
                radial-gradient(circle at 50% -10%, #242b3c 0%, #0b0d12 48%);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back {
            color: var(--muted);
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: white;
        }

        .card {
            background: rgba(21,25,34,0.95);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 35px;
        }

        .mode {
            display: inline-flex;
            gap: 8px;
            background: var(--card2);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .mode button {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .mode button.active {
            background: white;
            color: #0b0d12;
        }

        .timer {
            font-size: 100px;
            font-weight: 900;
            letter-spacing: -5px;
            margin: 20px 0;
        }

        .status {
            color: var(--muted);
            font-size: 16px;
            margin-bottom: 25px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: var(--card2);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.3s linear;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .buttons button {
            border: 1px solid var(--border);
            background: var(--card2);
            color: white;
            padding: 13px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .buttons button.primary {
            background: white;
            color: #0b0d12;
        }

        .buttons button:hover {
            transform: translateY(-1px);
        }

        .settings {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .settings h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            text-align: left;
            color: var(--muted);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: white;
            outline: none;
        }

        .sessions {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .stat strong {
            display: block;
            font-size: 25px;
        }

        .stat span {
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 25px 18px;
            }

            h1 {
                font-size: 34px;
            }

            .timer {
                font-size: 70px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <a class="back" href="../index.html">
            ← Galoulou Toolbox
        </a>
    </div>

    <div class="card">

        <div class="icon">🍅</div>

        <h1>Pomodoro</h1>

        <p class="subtitle">
            Concentre-toi, travaille, puis prends une pause.
        </p>

        <div class="mode">
            <button id="workMode" class="active">
                Travail
            </button>

            <button id="breakMode">
                Pause
            </button>
        </div>

        <div id="timer" class="timer">
            25:00
        </div>

        <div id="status" class="status">
            Prêt à travailler 🚀
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="buttons">

            <button id="start" class="primary">
                ▶ Démarrer
            </button>

            <button id="pause">
                ⏸ Pause
            </button>

            <button id="reset">
                🔄 Réinitialiser
            </button>

        </div>

        <div class="settings">

            <h2>⚙️ Durées</h2>

            <div class="settings-grid">

                <div>
                    <label for="workTime">
                        Travail (minutes)
                    </label>

                    <input
                        id="workTime"
                        type="number"
                        min="1"
                        max="180"
                        value="25"
                    >
                </div>

                <div>
                    <label for="breakTime">
                        Pause (minutes)
                    </label>

                    <input
                        id="breakTime"
                        type="number"
                        min="1"
                        max="60"
                        value="5"
                    >
                </div>

            </div>

        </div>

        <div class="sessions">

            <div class="stat">
                <strong id="sessionCount">0</strong>
                <span>sessions terminées</span>
            </div>

            <div class="stat">
                <strong id="totalMinutes">0</strong>
                <span>minutes travaillées</span>
            </div>

        </div>

    </div>

</div>

<script>

const timerDisplay = document.getElementById("timer");
const statusDisplay = document.getElementById("status");
const progressBar = document.getElementById("progressBar");

const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const resetButton = document.getElementById("reset");

const workMode = document.getElementById("workMode");
const breakMode = document.getElementById("breakMode");

const workInput = document.getElementById("workTime");
const breakInput = document.getElementById("breakTime");

const sessionCountDisplay = document.getElementById("sessionCount");
const totalMinutesDisplay = document.getElementById("totalMinutes");

let mode = "work";
let timer = null;
let remainingSeconds = 25 * 60;
let totalSeconds = 25 * 60;

let sessions = Number(
    localStorage.getItem("galoulou_pomodoro_sessions") || 0
);

let totalMinutes = Number(
    localStorage.getItem("galoulou_pomodoro_minutes") || 0
);

function updateStats() {

    sessionCountDisplay.textContent = sessions;
    totalMinutesDisplay.textContent = totalMinutes;

}

function updateDisplay() {

    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;

    timerDisplay.textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    const progress =
        ((totalSeconds - remainingSeconds) / totalSeconds) * 100;

    progressBar.style.width = `${progress}%`;

}

function setMode(newMode) {

    mode = newMode;

    clearInterval(timer);
    timer = null;

    if (mode === "work") {

        totalSeconds = Number(workInput.value) * 60;
        remainingSeconds = totalSeconds;

        workMode.classList.add("active");
        breakMode.classList.remove("active");

        statusDisplay.textContent =
            "Prêt à travailler 🚀";

    } else {

        totalSeconds = Number(breakInput.value) * 60;
        remainingSeconds = totalSeconds;

        breakMode.classList.add("active");
        workMode.classList.remove("active");

        statusDisplay.textContent =
            "Profite de ta pause ☕";

    }

    startButton.textContent = "▶ Démarrer";

    updateDisplay();

}

function startTimer() {

    if (timer) return;

    statusDisplay.textContent =
        mode === "work"
        ? "Concentration maximale 💪"
        : "Pause bien méritée ☕";

    startButton.textContent = "▶ En cours...";

    timer = setInterval(() => {

        if (remainingSeconds > 0) {

            remainingSeconds--;

            updateDisplay();

        } else {

            clearInterval(timer);
            timer = null;

            finishSession();

        }

    }, 1000);

}

function pauseTimer() {

    clearInterval(timer);
    timer = null;

    startButton.textContent = "▶ Reprendre";

    statusDisplay.textContent = "En pause ⏸️";

}

function resetTimer() {

    clearInterval(timer);
    timer = null;

    setMode(mode);

}

function finishSession() {

    if (mode === "work") {

        sessions++;
        totalMinutes += Number(workInput.value);

        localStorage.setItem(
            "galoulou_pomodoro_sessions",
            sessions
        );

        localStorage.setItem(
            "galoulou_pomodoro_minutes",
            totalMinutes
        );

        updateStats();

        statusDisplay.textContent =
            "Session terminée ! 🎉 Passe en pause.";

        alert("🍅 Session terminée !\n\nPlace à une petite pause ☕");

        setMode("break");

    } else {

        statusDisplay.textContent =
            "Pause terminée ! 🚀 Retour au travail.";

        alert("☕ Pause terminée !\n\nC'est reparti 🚀");

        setMode("work");

    }

}

startButton.addEventListener("click", startTimer);
pauseButton.addEventListener("click", pauseTimer);
resetButton.addEventListener("click", resetTimer);

workMode.addEventListener("click", () => setMode("work"));
breakMode.addEventListener("click", () => setMode("break"));

workInput.addEventListener("change", () => {

    if (!timer && mode === "work") {
        setMode("work");
    }

});

breakInput.addEventListener("change", () => {

    if (!timer && mode === "break") {
        setMode("break");
    }

});

updateStats();
updateDisplay();

</script>

</body>
</html>
