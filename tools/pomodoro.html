<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pomodoro - Galoulou Toolbox</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
    background:#181b24;
    padding:35px;
    border-radius:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

h1{
    margin-top:0;
}

.mode{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:20px 0;
}

.mode button{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    background:#252936;
    color:white;
    cursor:pointer;
}

.mode button.active{
    background:#5865f2;
}

#timer{
    font-size:80px;
    font-weight:bold;
    margin:25px 0;
    letter-spacing:3px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:12px;
}

.controls button{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#5865f2;
}

.controls button:hover{
    opacity:.85;
}

.sessions{
    margin-top:25px;
    opacity:.7;
}
</style>
</head>

<body>

<div class="container">

<h1>🍅 Pomodoro</h1>

<p id="status">Prêt à travailler</p>

<div class="mode">

<button id="workBtn" class="active" onclick="setMode('work')">
25 min
</button>

<button id="shortBtn" onclick="setMode('short')">
5 min
</button>

<button id="longBtn" onclick="setMode('long')">
15 min
</button>

</div>

<div id="timer">25:00</div>

<div class="controls">

<button onclick="startTimer()">▶ Démarrer</button>

<button onclick="pauseTimer()">⏸ Pause</button>

<button onclick="resetTimer()">↻ Reset</button>

</div>

<div class="sessions">
🍅 Sessions terminées : <strong id="sessions">0</strong>
</div>

</div>

<script>

let durations = {
    work:25*60,
    short:5*60,
    long:15*60
};

let currentMode = "work";
let remaining = durations.work;
let interval = null;

let sessions =
    Number(localStorage.getItem("galoulou_pomodoro_sessions") || 0);

const timer = document.getElementById("timer");
const statusText = document.getElementById("status");

function updateDisplay(){

    let minutes = Math.floor(remaining / 60);
    let seconds = remaining % 60;

    timer.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");
}

function startTimer(){

    if(interval) return;

    statusText.textContent =
        currentMode === "work"
        ? "💪 Concentration en cours..."
        : "☕ Pause en cours...";

    interval = setInterval(()=>{

        remaining--;

        updateDisplay();

        if(remaining <= 0){

            clearInterval(interval);
            interval = null;

            if(currentMode === "work"){

                sessions++;

                localStorage.setItem(
                    "galoulou_pomodoro_sessions",
                    sessions
                );

                document.getElementById("sessions")
                    .textContent = sessions;

                statusText.textContent =
                    "🎉 Session terminée ! Fais une pause.";

            }else{

                statusText.textContent =
                    "🔥 La pause est terminée !";
            }

            playSound();
        }

    },1000);
}

function pauseTimer(){

    clearInterval(interval);
    interval = null;

    statusText.textContent = "⏸ En pause";
}

function resetTimer(){

    pauseTimer();

    remaining = durations[currentMode];

    statusText.textContent = "Prêt à travailler";

    updateDisplay();
}

function setMode(mode){

    currentMode = mode;

    document.querySelectorAll(".mode button")
        .forEach(btn=>btn.classList.remove("active"));

    if(mode === "work")
        document.getElementById("workBtn").classList.add("active");

    if(mode === "short")
        document.getElementById("shortBtn").classList.add("active");

    if(mode === "long")
        document.getElementById("longBtn").classList.add("active");

    resetTimer();
}

function playSound(){

    const audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    const oscillator =
        audioContext.createOscillator();

    oscillator.frequency.value = 800;

    oscillator.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .4
    );
}

document.getElementById("sessions").textContent = sessions;

updateDisplay();

</script>

</body>
</html>
