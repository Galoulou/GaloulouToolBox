<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Galoulou Toolbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-container {
            width: 100%;
            max-width: 650px;
            background: #181b24;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #252936;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            background: #5865f2;
            color: white;
        }

        button:hover {
            opacity: .85;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #222631;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        li span {
            flex: 1;
        }

        li.completed span {
            text-decoration: line-through;
            opacity: .5;
        }

        .delete {
            background: #e74c3c;
            padding: 8px 12px;
        }

        .counter {
            text-align: center;
            opacity: .6;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="todo-container">

    <h1>✅ To-Do List</h1>

    <div class="input-area">
        <input
            id="taskInput"
            type="text"
            placeholder="Ajouter une tâche..."
        >

        <button onclick="addTask()">Ajouter</button>
    </div>

    <ul id="taskList"></ul>

    <div class="counter">
        <span id="counter">0 tâche</span>
    </div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("galoulou_tasks")) || [];

function saveTasks() {
    localStorage.setItem(
        "galoulou_tasks",
        JSON.stringify(tasks)
    );
}

function displayTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach((task, index) => {

        const li = document.createElement("li");

        if (task.completed) {
            li.classList.add("completed");
        }

        li.innerHTML = `

            <input
                type="checkbox"
                ${task.completed ? "checked" : ""}
                onchange="completeTask(${index})"
            >

            <span>${escapeHTML(task.text)}</span>

            <button
                class="delete"
                onclick="deleteTask(${index})"
            >
                🗑️
            </button>
        `;

        list.appendChild(li);
    });

    updateCounter();
}

function addTask() {

    const input = document.getElementById("taskInput");

    const text = input.value.trim();

    if (text === "") return;

    tasks.push({
        text: text,
        completed: false
    });

    input.value = "";

    saveTasks();

    displayTasks();
}

function completeTask(index) {

    tasks[index].completed =
        !tasks[index].completed;

    saveTasks();

    displayTasks();
}

function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    displayTasks();
}

function updateCounter() {

    const remaining =
        tasks.filter(task => !task.completed).length;

    document.getElementById("counter").textContent =
        remaining +
        (remaining > 1 ? " tâches restantes" : " tâche restante");
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

document
    .getElementById("taskInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            addTask();
        }

    });

displayTasks();

</script>

</body>
</html>
