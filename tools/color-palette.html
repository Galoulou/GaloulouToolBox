<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Color Palette - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png"
     alt="Galoulou Toolbox Logo">

<span>Galoulou Toolbox</span>

</a>

<a href="../index.html#tools"
   class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
   class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>🎨 Color Palette</h1>

<p>
Créez de magnifiques palettes de couleurs aléatoires.
</p>

</div>


<div class="tool-card">

<button class="tool-button"
        onclick="generatePalette()">

<i class="fa-solid fa-palette"></i>

Générer une palette

</button>


<div id="palette"
     class="palette"></div>


<p class="status">
Clique sur une couleur pour copier son code.
</p>

</div>

</div>

</main>


<script>

function randomColor() {

return "#" +
Math.floor(Math.random() * 16777215)
.toString(16)
.padStart(6, "0");

}


function generatePalette() {

const palette =
document.getElementById("palette");

palette.innerHTML = "";


for (let i = 0; i < 5; i++) {

const color = randomColor();

const card =
document.createElement("div");

card.className = "color-card";

card.style.background = color;

card.innerHTML =
`<span class="color-code">${color}</span>`;


card.onclick = () => {

navigator.clipboard.writeText(color);

card.querySelector(".color-code")
.textContent = "✓ Copié !";


setTimeout(() => {

card.querySelector(".color-code")
.textContent = color;

}, 1000);

};


palette.appendChild(card);

}

}


generatePalette();

</script>

</body>
</html>
