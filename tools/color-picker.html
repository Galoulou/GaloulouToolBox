<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Picker - Galoulou Toolbox</title>

    <meta name="description"
        content="Pick colors and get HEX and RGB codes instantly.">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* ==============================
           PAGE
        ============================== */

        .tool-page {
            min-height: 100vh;
            padding: 80px 20px;
        }

        .tool-container {
            max-width: 850px;
            margin: 0 auto;
        }


        /* ==============================
           BACK BUTTON
        ============================== */

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: var(--text-secondary);

            margin-bottom: 50px;

            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: var(--text);
        }


        /* ==============================
           HEADER
        ============================== */

        .tool-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .tool-header h1 {
            font-size: clamp(40px, 7vw, 70px);
            letter-spacing: -3px;
            margin-bottom: 12px;
        }

        .tool-header p {
            color: var(--text-secondary);
            font-size: 17px;
        }


        /* ==============================
           COLOR CARD
        ============================== */

        .color-card {
            background: var(--card);
            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 35px;
        }


        /* ==============================
           COLOR PREVIEW
        ============================== */

        .color-preview {
            width: 100%;
            height: 280px;

            background: #000000;

            border-radius: 16px;

            border: 1px solid var(--border);

            margin-bottom: 25px;

            position: relative;

            overflow: hidden;

            transition: background 0.2s ease;
        }

        .color-preview-text {
            position: absolute;

            left: 25px;
            bottom: 22px;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: -1px;

            color: white;

            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }


        /* ==============================
           PICKER ROW
        ============================== */

        .picker-row {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 25px;
        }

        .color-input-wrapper {
            position: relative;

            width: 65px;
            height: 65px;

            border-radius: 14px;

            overflow: hidden;

            border: 1px solid var(--border);

            flex-shrink: 0;
        }

        #colorPicker {
            width: 130px;
            height: 130px;

            position: absolute;

            top: -32px;
            left: -32px;

            cursor: pointer;

            border: none;

            padding: 0;
        }

        .picker-info {
            flex: 1;
        }

        .picker-info h3 {
            margin-bottom: 5px;
            font-size: 16px;
        }

        .picker-info p {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .random-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 13px 18px;

            background: var(--button);
            color: var(--button-text);

            border: none;
            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .random-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }


        /* ==============================
           COLOR CODES
        ============================== */

        .color-codes {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;

            margin-top: 25px;
        }

        .color-code {
            padding: 16px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);

            border-radius: 13px;
        }

        .code-label {
            display: block;

            color: var(--text-secondary);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        .code-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .code-value {
            font-family: monospace;

            font-size: 17px;

            font-weight: 700;
        }

        .copy-code {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            color: var(--text-secondary);

            border: 1px solid var(--border);

            border-radius: 8px;

            cursor: pointer;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .copy-code:hover {
            color: var(--text);
            background: var(--card);
        }


        /* ==============================
           HISTORY
        ============================== */

        .history {
            margin-top: 35px;

            padding-top: 30px;

            border-top: 1px solid var(--border);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .history-header h2 {
            font-size: 16px;
        }

        .clear-history {
            background: transparent;

            border: none;

            color: var(--text-secondary);

            cursor: pointer;

            font-size: 13px;
        }

        .clear-history:hover {
            color: var(--text);
        }

        .history-colors {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;
        }

        .history-color {
            width: 55px;
            height: 55px;

            border-radius: 12px;

            border: 1px solid var(--border);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;

            position: relative;
        }

        .history-color:hover {
            transform: translateY(-4px);
            border-color: var(--text-secondary);
        }

        .history-empty {
            color: var(--text-secondary);

            font-size: 13px;
        }


        /* ==============================
           COPY MESSAGE
        ============================== */

        .copy-message {
            text-align: center;

            color: var(--text-secondary);

            font-size: 13px;

            margin-top: 20px;

            min-height: 20px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .tool-page {
                padding: 55px 16px;
            }

            .color-card {
                padding: 22px;
            }

            .color-preview {
                height: 220px;
            }

            .picker-row {
                flex-wrap: wrap;
            }

            .picker-info {
                min-width: 150px;
            }

            .random-button {
                width: 100%;
            }

            .color-codes {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">

            <img
                src="../assets/galouloutoolbox.png"
                alt="Galoulou Toolbox Logo"
            >

            <span>Galoulou Toolbox</span>

        </a>


        <a href="../index.html#tools"
            class="discord-button">

            <i class="fa-solid fa-arrow-left"></i>

            All Tools

        </a>

    </header>


    <!-- MAIN -->

    <main class="tool-page">

        <div class="tool-container">


            <!-- BACK -->

            <a href="../index.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Toolbox

            </a>


            <!-- HEADER -->

            <div class="tool-header">

                <h1>Color Picker</h1>

                <p>
                    Pick a color and get its codes instantly.
                </p>

            </div>


            <!-- COLOR CARD -->

            <div class="color-card">


                <!-- PREVIEW -->

                <div
                    class="color-preview"
                    id="colorPreview"
                >

                    <span
                        class="color-preview-text"
                        id="previewHex"
                    >
                        #000000
                    </span>

                </div>


                <!-- PICKER -->

                <div class="picker-row">


                    <div class="color-input-wrapper">

                        <input
                            type="color"
                            id="colorPicker"
                            value="#000000"
                        >

                    </div>


                    <div class="picker-info">

                        <h3>Choose a color</h3>

                        <p>
                            Use the color picker or generate a random color.
                        </p>

                    </div>


                    <button
                        class="random-button"
                        id="randomButton"
                    >

                        <i class="fa-solid fa-shuffle"></i>

                        Random

                    </button>


                </div>


                <!-- COLOR CODES -->

                <div class="color-codes">


                    <!-- HEX -->

                    <div class="color-code">

                        <span class="code-label">
                            HEX
                        </span>


                        <div class="code-row">

                            <span
                                class="code-value"
                                id="hexValue"
                            >
                                #000000
                            </span>


                            <button
                                class="copy-code"
                                data-copy="hex"
                                title="Copy HEX"
                            >

                                <i class="fa-regular fa-copy"></i>

                            </button>

                        </div>

                    </div>


                    <!-- RGB -->

                    <div class="color-code">

                        <span class="code-label">
                            RGB
                        </span>


                        <div class="code-row">

                            <span
                                class="code-value"
                                id="rgbValue"
                            >
                                rgb(0, 0, 0)
                            </span>


                            <button
                                class="copy-code"
                                data-copy="rgb"
                                title="Copy RGB"
                            >

                                <i class="fa-regular fa-copy"></i>

                            </button>

                        </div>

                    </div>


                </div>


                <!-- HISTORY -->

                <div class="history">


                    <div class="history-header">

                        <h2>
                            Recent Colors
                        </h2>


                        <button
                            class="clear-history"
                            id="clearHistory"
                        >
                            Clear history
                        </button>

                    </div>


                    <div
                        class="history-colors"
                        id="historyColors"
                    ></div>


                </div>


                <!-- MESSAGE -->

                <p
                    class="copy-message"
                    id="copyMessage"
                ></p>


            </div>

        </div>

    </main>


    <script>

        // ==============================
        // ELEMENTS
        // ==============================

        const colorPicker =
            document.getElementById("colorPicker");

        const colorPreview =
            document.getElementById("colorPreview");

        const previewHex =
            document.getElementById("previewHex");

        const hexValue =
            document.getElementById("hexValue");

        const rgbValue =
            document.getElementById("rgbValue");

        const randomButton =
            document.getElementById("randomButton");

        const historyColors =
            document.getElementById("historyColors");

        const clearHistory =
            document.getElementById("clearHistory");

        const copyMessage =
            document.getElementById("copyMessage");


        // ==============================
        // HISTORY
        // ==============================

        let colorHistory = JSON.parse(
            localStorage.getItem("galoulouColorHistory")
        ) || [];


        function saveHistory() {

            localStorage.setItem(
                "galoulouColorHistory",
                JSON.stringify(colorHistory)
            );

        }


        // ==============================
        // HEX TO RGB
        // ==============================

        function hexToRgb(hex) {

            const value =
                hex.replace("#", "");


            const r =
                parseInt(value.substring(0, 2), 16);

            const g =
                parseInt(value.substring(2, 4), 16);

            const b =
                parseInt(value.substring(4, 6), 16);


            return `rgb(${r}, ${g}, ${b})`;

        }


        // ==============================
        // UPDATE COLOR
        // ==============================

        function updateColor(color, addToHistory = true) {

            colorPicker.value = color;

            colorPreview.style.background = color;

            previewHex.textContent = color.toUpperCase();

            hexValue.textContent = color.toUpperCase();

            rgbValue.textContent =
                hexToRgb(color);


            // Add to history

            if (addToHistory) {

                const upperColor =
                    color.toUpperCase();


                // Remove duplicate

                colorHistory =
                    colorHistory.filter(
                        item => item !== upperColor
                    );


                // Add to beginning

                colorHistory.unshift(
                    upperColor
                );


                // Maximum 12 colors

                colorHistory =
                    colorHistory.slice(0, 12);


                saveHistory();

                renderHistory();

            }

        }


        // ==============================
        // COLOR PICKER
        // ==============================

        colorPicker.addEventListener(
            "input",
            () => {

                updateColor(
                    colorPicker.value
                );

            }
        );


        // ==============================
        // RANDOM COLOR
        // ==============================

        function generateRandomColor() {

            const values =
                new Uint8Array(3);


            crypto.getRandomValues(values);


            const color =
                "#" +
                Array.from(values)
                    .map(value =>
                        value
                            .toString(16)
                            .padStart(2, "0")
                    )
                    .join("");


            updateColor(color);

        }


        randomButton.addEventListener(
            "click",
            generateRandomColor
        );


        // ==============================
        // COPY
        // ==============================

        document
            .querySelectorAll(".copy-code")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    async () => {

                        const type =
                            button.dataset.copy;


                        let value;


                        if (type === "hex") {

                            value =
                                hexValue.textContent;

                        } else {

                            value =
                                rgbValue.textContent;

                        }


                        try {

                            await navigator.clipboard
                                .writeText(value);


                            copyMessage.textContent =
                                `✓ ${type.toUpperCase()} copied!`;


                            setTimeout(() => {

                                copyMessage.textContent = "";

                            }, 2000);


                        } catch (error) {

                            copyMessage.textContent =
                                "Unable to copy.";

                        }

                    }
                );

            });


        // ==============================
        // RENDER HISTORY
        // ==============================

        function renderHistory() {

            historyColors.innerHTML = "";


            if (colorHistory.length === 0) {

                historyColors.innerHTML = `

                    <p class="history-empty">
                        No recent colors yet.
                    </p>

                `;

                return;

            }


            colorHistory.forEach(color => {

                const colorElement =
                    document.createElement("button");


                colorElement.className =
                    "history-color";


                colorElement.style.background =
                    color;


                colorElement.title =
                    color;


                colorElement.addEventListener(
                    "click",
                    () => {

                        updateColor(color);

                    }
                );


                historyColors.appendChild(
                    colorElement
                );

            });

        }


        // ==============================
        // CLEAR HISTORY
        // ==============================

        clearHistory.addEventListener(
            "click",
            () => {

                colorHistory = [];


                saveHistory();

                renderHistory();

            }
        );


        // ==============================
        // START
        // ==============================

        renderHistory();

        updateColor(
            "#000000",
            false
        );

    </script>

</body>

</html>
