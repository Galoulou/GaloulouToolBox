<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - Galoulou Toolbox</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
}

.calculator{
    width:100%;
    max-width:380px;
    background:#181b24;
    padding:25px;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-top:0;
}

#display{
    width:100%;
    height:80px;
    margin-bottom:15px;
    border:0;
    border-radius:14px;
    background:#252936;
    color:white;
    font-size:32px;
    text-align:right;
    padding:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:65px;
    border:0;
    border-radius:13px;
    background:#252936;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#343947;
}

.operator{
    background:#5865f2;
}

.equal{
    background:#22c55e;
}

.clear{
    background:#ef4444;
}

.history{
    margin-top:20px;
    background:#12141a;
    padding:12px;
    border-radius:12px;
    max-height:120px;
    overflow:auto;
}

.history div{
    padding:5px;
    opacity:.7;
}
</style>
</head>

<body>

<div class="calculator">

<h1>🧮 Calculator</h1>

<input id="display" type="text" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="square()">x²</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<div class="history">
<strong>Historique</strong>
<div id="history"></div>
</div>

</div>

<script>

const display = document.getElementById("display");
const historyBox = document.getElementById("history");

let history = JSON.parse(
    localStorage.getItem("galoulou_calculator_history") || "[]"
);

function add(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function backspace(){
    display.value = display.value.slice(0,-1);
}

function square(){

    if(!display.value) return;

    try{
        display.value = Math.pow(
            Function('"use strict";return (' + display.value + ')')(),
            2
        );
    }catch{
        display.value = "Erreur";
    }
}

function calculate(){

    if(!display.value) return;

    try{

        let expression = display.value;

        let result = Function(
            '"use strict";return (' + expression + ')'
        )();

        if(!Number.isFinite(result)){
            throw new Error();
        }

        addHistory(expression + " = " + result);

        display.value = result;

    }catch{

        display.value = "Erreur";

        setTimeout(clearDisplay,1000);
    }
}

function addHistory(text){

    history.unshift(text);

    if(history.length > 10){
        history.pop();
    }

    localStorage.setItem(
        "galoulou_calculator_history",
        JSON.stringify(history)
    );

    displayHistory();
}

function displayHistory(){

    historyBox.innerHTML = history
        .map(item => `<div>${item}</div>`)
        .join("");
}

document.addEventListener("keydown",e=>{

    if(/[0-9.+\-*/%]/.test(e.key)){
        add(e.key);
    }

    if(e.key === "Enter"){
        calculate();
    }

    if(e.key === "Backspace"){
        backspace();
    }

    if(e.key === "Escape"){
        clearDisplay();
    }

});

displayHistory();

</script>

</body>
</html>
