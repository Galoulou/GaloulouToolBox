<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>URL Encoder - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png"
     alt="Galoulou Toolbox Logo">

<span>Galoulou Toolbox</span>

</a>

<a href="../index.html#tools"
   class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
   class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>🔗 URL Encoder</h1>

<p>
Encodez et décodez vos URLs rapidement.
</p>

</div>


<div class="tool-card">

<div class="tool-section">

<h2>🔗 URL</h2>

<textarea
id="input"
placeholder="https://example.com/hello world?test=oui"></textarea>

</div>


<div class="tool-button-row three">

<button class="tool-button"
        onclick="encodeURL()">

🔒 Encoder

</button>


<button class="tool-button"
        onclick="decodeURL()">

🔓 Décoder

</button>


<button class="tool-button secondary"
        onclick="clearAll()">

🗑️ Effacer

</button>

</div>


<div class="tool-section"
     style="margin-top:25px;">

<h2>📤 Résultat</h2>

<textarea
id="output"
readonly
placeholder="Résultat..."></textarea>

</div>


<button class="tool-button secondary"
        onclick="copyResult()">

📋 Copier le résultat

</button>


<p id="status"
   class="status"></p>

</div>

</div>

</main>


<script>

function encodeURL() {

const input =
document.getElementById("input").value;


if (!input) {

document.getElementById("status")
.textContent =
"❌ Écris quelque chose.";

return;

}


try {

document.getElementById("output")
.value =
encodeURIComponent(input);


document.getElementById("status")
.textContent =
"✅ URL encodée !";

} catch {

document.getElementById("status")
.textContent =
"❌ Erreur.";

}

}


function decodeURL() {

const input =
document.getElementById("input").value;


if (!input) {

document.getElementById("status")
.textContent =
"❌ Écris quelque chose.";

return;

}


try {

document.getElementById("output")
.value =
decodeURIComponent(input);


document.getElementById("status")
.textContent =
"✅ URL décodée !";

} catch {

document.getElementById("status")
.textContent =
"❌ URL invalide.";

}

}


function copyResult() {

const result =
document.getElementById("output").value;


if (!result) return;


navigator.clipboard.writeText(result);


document.getElementById("status")
.textContent =
"✅ Copié !";

}


function clearAll() {

document.getElementById("input").value = "";

document.getElementById("output").value = "";

document.getElementById("status").textContent = "";

}

</script>

</body>
</html>
