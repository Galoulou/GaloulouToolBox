<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Base64 Encoder - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.tool-page {
    min-height: 100vh;
    padding: 80px 20px;
}

.tool-container {
    max-width: 800px;
    margin: auto;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: var(--text-secondary);

    margin-bottom: 50px;
}

.tool-header {
    text-align: center;
    margin-bottom: 45px;
}

.tool-header h1 {
    font-size: clamp(40px, 7vw, 70px);
    letter-spacing: -3px;
    margin-bottom: 12px;
}

.tool-header p {
    color: var(--text-secondary);
    font-size: 17px;
}

.base-card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 35px;
}

.section-title {

    font-size: 13px;

    font-weight: 700;

    color: var(--text-secondary);

    letter-spacing: 1px;

    margin-bottom: 12px;
}

.textarea {

    width: 100%;

    min-height: 170px;

    resize: vertical;

    padding: 15px;

    background: var(--bg-secondary);

    border: 1px solid var(--border);

    border-radius: 12px;

    color: var(--text);

    outline: none;

    font-family: monospace;

    font-size: 14px;

    margin-bottom: 15px;
}

.textarea:focus {

    border-color: var(--border-hover);

}

.buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap: 10px;

    margin-bottom: 30px;
}

.button {

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: var(--button);

    color: var(--button-text);

    font-weight: 700;

    cursor: pointer;
}

.button.secondary {

    background: var(--bg-secondary);

    color: var(--text);

    border: 1px solid var(--border);
}

.message {

    text-align: center;

    color: var(--text-secondary);

    font-size: 13px;

    min-height: 20px;
}

@media (max-width:600px) {

    .tool-page {
        padding: 55px 16px;
    }

    .base-card {
        padding: 22px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png">

<span>Boîte à outils Galoulou</span>

</a>

<a href="../index.html#tools"
class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>💻 Base64 Encoder</h1>

<p>
Encodez ou décodez du texte en Base64.
</p>

</div>


<div class="base-card">

<p class="section-title">
TEXTE À TRAITER
</p>


<textarea
id="input"
class="textarea"
placeholder="Écrivez votre texte ici..."></textarea>


<div class="buttons">

<button
class="button"
onclick="encode()">

🔒 Encoder

</button>


<button
class="button"
onclick="decode()">

🔓 Décoder

</button>


<button
class="button secondary"
onclick="clearAll()">

Effacer

</button>

</div>


<p class="section-title">
RÉSULTAT
</p>


<textarea
id="output"
class="textarea"
readonly
placeholder="Le résultat apparaîtra ici..."></textarea>


<button
class="button secondary"
style="width:100%;"
onclick="copyResult()">

<i class="fa-regular fa-copy"></i>

&nbsp; Copier le résultat

</button>


<p
id="message"
class="message">

</p>

</div>

</div>

</main>


<script>

function encode() {

const text =
document.getElementById("input").value;


try {

const bytes =
new TextEncoder().encode(text);


let binary = "";


for (const byte of bytes) {

binary +=
String.fromCharCode(byte);

}


document.getElementById("output")
.value =
btoa(binary);


document.getElementById("message")
.textContent =
"✓ Texte encodé.";

}

catch {

document.getElementById("message")
.textContent =
"❌ Une erreur est survenue.";

}

}


function decode() {

const text =
document.getElementById("input").value;


try {

const binary =
atob(text);


const bytes =
Uint8Array.from(
binary,
char => char.charCodeAt(0)
);


document.getElementById("output")
.value =
new TextDecoder().decode(bytes);


document.getElementById("message")
.textContent =
"✓ Texte décodé.";

}

catch {

document.getElementById("message")
.textContent =
"❌ Base64 invalide.";

}

}


function copyResult() {

const output =
document.getElementById("output");


if (!output.value) return;


navigator.clipboard.writeText(
output.value
);


document.getElementById("message")
.textContent =
"✓ Copié !";

}


function clearAll() {

document.getElementById("input")
.value = "";

document.getElementById("output")
.value = "";

document.getElementById("message")
.textContent = "";

}

</script>

</body>

</html>
