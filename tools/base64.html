<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Base64 Encoder - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png"
     alt="Galoulou Toolbox Logo">

<span>Galoulou Toolbox</span>

</a>

<a href="../index.html#tools"
   class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
   class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>💻 Base64 Encoder</h1>

<p>
Encodez et décodez du texte en Base64 facilement.
</p>

</div>


<div class="tool-card">

<div class="tool-section">

<h2>📝 Texte</h2>

<textarea
id="input"
placeholder="Écris ton texte ici..."></textarea>

</div>


<div class="tool-button-row three">

<button class="tool-button"
        onclick="encodeBase64()">

🔒 Encoder

</button>


<button class="tool-button"
        onclick="decodeBase64()">

🔓 Décoder

</button>


<button class="tool-button secondary"
        onclick="clearText()">

🗑️ Effacer

</button>

</div>


<div class="tool-section"
     style="margin-top:25px;">

<h2>📤 Résultat</h2>

<textarea
id="output"
readonly
placeholder="Résultat..."></textarea>

</div>


<button class="tool-button secondary"
        onclick="copyResult()">

📋 Copier le résultat

</button>


<p id="status"
   class="status"></p>

</div>

</div>

</main>


<script>

function encodeBase64() {

const input =
document.getElementById("input").value;


try {

const bytes =
new TextEncoder().encode(input);


let binary = "";


bytes.forEach(byte => {

binary +=
String.fromCharCode(byte);

});


document.getElementById("output")
.value =
btoa(binary);


document.getElementById("status")
.textContent =
"✅ Texte encodé !";


} catch {

document.getElementById("status")
.textContent =
"❌ Impossible d'encoder.";

}

}


function decodeBase64() {

const input =
document.getElementById("input").value;


try {

const binary =
atob(input);


const bytes =
Uint8Array.from(
binary,
c => c.charCodeAt(0)
);


document.getElementById("output")
.value =
new TextDecoder().decode(bytes);


document.getElementById("status")
.textContent =
"✅ Base64 décodé !";


} catch {

document.getElementById("status")
.textContent =
"❌ Base64 invalide.";

}

}


function copyResult() {

const result =
document.getElementById("output").value;


if (!result) return;


navigator.clipboard.writeText(result);


document.getElementById("status")
.textContent =
"✅ Copié !";

}


function clearText() {

document.getElementById("input").value = "";

document.getElementById("output").value = "";

document.getElementById("status").textContent = "";

}

</script>

</body>
</html>
