<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Resizer - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.tool-page {
    min-height: 100vh;
    padding: 80px 20px;
}

.tool-container {
    max-width: 800px;
    margin: auto;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: var(--text-secondary);

    margin-bottom: 50px;
}

.tool-header {
    text-align: center;
    margin-bottom: 45px;
}

.tool-header h1 {
    font-size: clamp(40px, 7vw, 70px);
    letter-spacing: -3px;
    margin-bottom: 12px;
}

.tool-header p {
    color: var(--text-secondary);
    font-size: 17px;
}

.resize-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 35px;
}

.section-title {
    font-size: 13px;
    font-weight: 700;

    color: var(--text-secondary);

    letter-spacing: 1px;

    margin-bottom: 15px;
}

.file-zone {

    border: 1px dashed var(--border-hover);

    background: var(--bg-secondary);

    border-radius: 14px;

    padding: 30px;

    text-align: center;

    cursor: pointer;

    margin-bottom: 25px;
}

.file-zone i {

    font-size: 28px;

    margin-bottom: 10px;
}

.file-zone p {

    color: var(--text-secondary);

    font-size: 13px;

}

.file-zone input {
    display: none;
}

.dimensions {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 18px;
}

.dimension {

    background: var(--bg-secondary);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 14px;
}

.dimension label {

    display: block;

    color: var(--text-secondary);

    font-size: 12px;

    margin-bottom: 8px;
}

.dimension input {

    width: 100%;

    background: transparent;

    border: none;

    outline: none;

    color: var(--text);

    font-size: 18px;

    font-weight: 700;
}

.ratio {

    color: var(--text-secondary);

    font-size: 13px;

    margin-bottom: 25px;
}

.button {

    width: 100%;

    padding: 16px;

    background: var(--button);

    color: var(--button-text);

    border: none;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    display: flex;

    justify-content: center;

    gap: 9px;

}

.download {

    display: none;

    margin-top: 12px;

    width: 100%;

    padding: 15px;

    justify-content: center;

    border-radius: 11px;

    background: var(--bg-secondary);

    border: 1px solid var(--border);

    font-weight: 700;
}

.status {

    text-align: center;

    color: var(--text-secondary);

    font-size: 13px;

    margin-top: 15px;
}

@media (max-width:600px) {

    .tool-page {
        padding: 55px 16px;
    }

    .resize-card {
        padding: 22px;
    }

    .dimensions {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png">

<span>Boîte à outils Galoulou</span>

</a>

<a href="../index.html#tools"
class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>🖼️ Image Resizer</h1>

<p>
Redimensionnez vos images rapidement et simplement.
</p>

</div>


<div class="resize-card">

<p class="section-title">
IMAGE
</p>


<label class="file-zone">

<i class="fa-regular fa-image"></i>

<p>
Cliquez ici pour choisir une image
</p>

<input
type="file"
id="file"
accept="image/*">

</label>


<p class="section-title">
DIMENSIONS
</p>


<div class="dimensions">

<div class="dimension">

<label>Largeur</label>

<input
type="number"
id="width">

</div>


<div class="dimension">

<label>Hauteur</label>

<input
type="number"
id="height">

</div>

</div>


<label class="ratio">

<input
type="checkbox"
id="ratio"
checked>

&nbsp; Conserver les proportions

</label>


<br>


<button
class="button"
onclick="resize()">

<i class="fa-solid fa-expand"></i>

Redimensionner

</button>


<a
id="download"
class="download">

<i class="fa-solid fa-download"></i>

&nbsp; Télécharger l'image

</a>


<p
id="status"
class="status">

Choisissez une image pour commencer.

</p>

</div>

</div>

</main>


<script>

let image = null;


document.getElementById("file")
.addEventListener("change", function(e) {

const file = e.target.files[0];

if (!file) return;


const reader =
new FileReader();


reader.onload = function(event) {

image = new Image();


image.onload = function() {

document.getElementById("width").value =
image.width;

document.getElementById("height").value =
image.height;

document.getElementById("status").textContent =
"Image chargée : " +
image.width + " × " +
image.height;

};

image.src =
event.target.result;

};

reader.readAsDataURL(file);

});


document.getElementById("width")
.addEventListener("input", function() {

if (
document.getElementById("ratio").checked &&
image
) {

document.getElementById("height").value =
Math.round(
this.value *
image.height /
image.width
);

}

});


function resize() {

if (!image) {

document.getElementById("status")
.textContent =
"❌ Choisissez une image.";

return;

}


const width =
Number(document.getElementById("width").value);

const height =
Number(document.getElementById("height").value);


if (width <= 0 || height <= 0) return;


const canvas =
document.createElement("canvas");


canvas.width = width;

canvas.height = height;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
image,
0,
0,
width,
height
);


canvas.toBlob(function(blob) {

const url =
URL.createObjectURL(blob);


const download =
document.getElementById("download");


download.href = url;

download.download =
"galoulou-resized.png";

download.style.display =
"flex";


document.getElementById("status")
.textContent =
"✓ Image redimensionnée !";

}, "image/png");

}

</script>

</body>

</html>
