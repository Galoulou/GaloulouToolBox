<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator - Galoulou Toolbox</title>

    <meta name="description"
        content="Generate strong and secure passwords instantly.">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        .tool-page {
            min-height: 100vh;
            padding: 80px 20px;
        }

        .tool-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            margin-bottom: 50px;
            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: var(--text);
        }

        .tool-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .tool-header h1 {
            font-size: clamp(40px, 7vw, 70px);
            letter-spacing: -3px;
            margin-bottom: 12px;
        }

        .tool-header p {
            color: var(--text-secondary);
            font-size: 17px;
        }

        .password-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
        }


        /* PASSWORD OUTPUT */

        .password-output {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 14px;
            margin-bottom: 25px;

            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        #password {
            flex: 1;

            background: transparent;
            border: none;
            outline: none;

            color: var(--text);

            font-size: 20px;
            font-weight: 600;

            min-width: 0;

            font-family: monospace;
        }

        .copy-button {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--button);
            color: var(--button-text);

            border: none;
            border-radius: 10px;

            cursor: pointer;

            transition: transform 0.2s ease;
        }

        .copy-button:hover {
            transform: scale(1.05);
        }


        /* STRENGTH */

        .strength-container {
            margin-bottom: 30px;
        }

        .strength-info {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 13px;
        }

        .strength-label {
            color: var(--text-secondary);
        }

        #strengthText {
            font-weight: 700;
        }

        .strength-bars {
            display: flex;
            gap: 6px;
        }

        .strength-bar {
            height: 5px;
            flex: 1;

            background: var(--border);
            border-radius: 10px;

            transition: background 0.25s ease;
        }


        /* SETTINGS */

        .settings-title {
            font-size: 13px;
            font-weight: 700;

            margin-bottom: 18px;

            color: var(--text-secondary);

            letter-spacing: 1px;
        }

        .length-setting {
            margin-bottom: 25px;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;

            margin-bottom: 12px;

            font-size: 14px;
            font-weight: 600;
        }

        #lengthValue {
            color: var(--text-secondary);
        }

        #lengthSlider {
            width: 100%;
            cursor: pointer;
            accent-color: var(--text);
        }


        /* OPTIONS */

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;

            margin-bottom: 30px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            background: var(--bg-secondary);

            border: 1px solid var(--border);
            border-radius: 11px;

            cursor: pointer;

            transition: border-color 0.2s ease;
        }

        .option:hover {
            border-color: var(--border-hover);
        }

        .option input {
            width: 17px;
            height: 17px;

            accent-color: var(--text);

            cursor: pointer;
        }


        /* GENERATE BUTTON */

        .generate-password-button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 16px;

            background: var(--button);
            color: var(--button-text);

            border: none;
            border-radius: 11px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .generate-password-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }


        /* COPY MESSAGE */

        .copy-message {
            text-align: center;

            color: var(--text-secondary);

            font-size: 13px;

            margin-top: 15px;

            min-height: 20px;
        }


        @media (max-width: 600px) {

            .tool-page {
                padding: 55px 16px;
            }

            .password-card {
                padding: 22px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            #password {
                font-size: 16px;
            }

        }

    </style>
</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="../index.html" class="logo">

            <img
                src="../assets/galouloutoolbox.png"
                alt="Galoulou Toolbox Logo"
            >

            <span>Galoulou Toolbox</span>

        </a>


        <a href="../index.html#tools"
            class="discord-button">

            <i class="fa-solid fa-arrow-left"></i>

            All Tools

        </a>

    </header>


    <!-- MAIN -->

    <main class="tool-page">

        <div class="tool-container">


            <!-- BACK -->

            <a href="../index.html"
                class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Toolbox

            </a>


            <!-- HEADER -->

            <div class="tool-header">

                <h1>Password Generator</h1>

                <p>
                    Generate strong and secure passwords instantly.
                </p>

            </div>


            <!-- PASSWORD GENERATOR -->

            <div class="password-card">


                <!-- PASSWORD -->

                <div class="password-output">

                    <input
                        type="text"
                        id="password"
                        readonly
                    >

                    <button
                        class="copy-button"
                        id="copyButton"
                        aria-label="Copy password"
                    >

                        <i class="fa-regular fa-copy"></i>

                    </button>

                </div>


                <!-- STRENGTH -->

                <div class="strength-container">

                    <div class="strength-info">

                        <span class="strength-label">
                            Password strength
                        </span>

                        <span id="strengthText">
                            Strong
                        </span>

                    </div>


                    <div class="strength-bars">

                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>

                    </div>

                </div>


                <!-- SETTINGS -->

                <p class="settings-title">
                    SETTINGS
                </p>


                <!-- LENGTH -->

                <div class="length-setting">

                    <div class="setting-label">

                        <span>Password length</span>

                        <span id="lengthValue">
                            16
                        </span>

                    </div>


                    <input
                        type="range"
                        id="lengthSlider"
                        min="4"
                        max="64"
                        value="16"
                    >

                </div>


                <!-- OPTIONS -->

                <div class="options">


                    <label class="option">

                        <input
                            type="checkbox"
                            id="uppercase"
                            checked
                        >

                        <span>
                            Uppercase letters (A-Z)
                        </span>

                    </label>


                    <label class="option">

                        <input
                            type="checkbox"
                            id="lowercase"
                            checked
                        >

                        <span>
                            Lowercase letters (a-z)
                        </span>

                    </label>


                    <label class="option">

                        <input
                            type="checkbox"
                            id="numbers"
                            checked
                        >

                        <span>
                            Numbers (0-9)
                        </span>

                    </label>


                    <label class="option">

                        <input
                            type="checkbox"
                            id="symbols"
                            checked
                        >

                        <span>
                            Symbols (!@#$...)
                        </span>

                    </label>


                </div>


                <!-- GENERATE -->

                <button
                    class="generate-password-button"
                    id="generateButton"
                >

                    <i class="fa-solid fa-wand-magic-sparkles"></i>

                    Generate Password

                </button>


                <!-- MESSAGE -->

                <p
                    class="copy-message"
                    id="copyMessage"
                ></p>


            </div>

        </div>

    </main>


    <script>

        // ==============================
        // ELEMENTS
        // ==============================

        const passwordInput =
            document.getElementById("password");

        const lengthSlider =
            document.getElementById("lengthSlider");

        const lengthValue =
            document.getElementById("lengthValue");

        const uppercase =
            document.getElementById("uppercase");

        const lowercase =
            document.getElementById("lowercase");

        const numbers =
            document.getElementById("numbers");

        const symbols =
            document.getElementById("symbols");

        const generateButton =
            document.getElementById("generateButton");

        const copyButton =
            document.getElementById("copyButton");

        const copyMessage =
            document.getElementById("copyMessage");

        const strengthText =
            document.getElementById("strengthText");

        const strengthBars =
            document.querySelectorAll(".strength-bar");


        // ==============================
        // CHARACTERS
        // ==============================

        const uppercaseChars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const lowercaseChars =
            "abcdefghijklmnopqrstuvwxyz";

        const numberChars =
            "0123456789";

        const symbolChars =
            "!@#$%^&*()_+-=[]{}<>?";


        // ==============================
        // RANDOM CHARACTER
        // ==============================

        function getRandomCharacter(characters) {

            const randomIndex =
                crypto.getRandomValues(
                    new Uint32Array(1)
                )[0] % characters.length;

            return characters[randomIndex];

        }


        // ==============================
        // SHUFFLE PASSWORD
        // ==============================

        function shufflePassword(password) {

            const array = password.split("");

            for (let i = array.length - 1; i > 0; i--) {

                const randomIndex =
                    crypto.getRandomValues(
                        new Uint32Array(1)
                    )[0] % (i + 1);


                [array[i], array[randomIndex]] =
                    [array[randomIndex], array[i]];

            }

            return array.join("");

        }


        // ==============================
        // GENERATE PASSWORD
        // ==============================

        function generatePassword() {

            const length =
                Number(lengthSlider.value);


            let selectedGroups = [];


            if (uppercase.checked) {
                selectedGroups.push(uppercaseChars);
            }

            if (lowercase.checked) {
                selectedGroups.push(lowercaseChars);
            }

            if (numbers.checked) {
                selectedGroups.push(numberChars);
            }

            if (symbols.checked) {
                selectedGroups.push(symbolChars);
            }


            // Prevent empty password

            if (selectedGroups.length === 0) {

                copyMessage.textContent =
                    "Please select at least one option.";

                passwordInput.value = "";

                return;

            }


            // Make sure every selected group
            // appears at least once

            let password = "";

            selectedGroups.forEach((group) => {

                password += getRandomCharacter(group);

            });


            // All allowed characters

            const allCharacters =
                selectedGroups.join("");


            // Fill the rest

            while (password.length < length) {

                password +=
                    getRandomCharacter(allCharacters);

            }


            // Shuffle for better randomness

            password =
                shufflePassword(password);


            // Display

            passwordInput.value = password;


            copyMessage.textContent = "";


            updateStrength();

        }


        // ==============================
        // STRENGTH SYSTEM
        // ==============================

        function updateStrength() {

            let score = 0;

            const length =
                Number(lengthSlider.value);


            // Length score

            if (length >= 8) score++;
            if (length >= 12) score++;


            // Character types

            if (uppercase.checked) score++;
            if (lowercase.checked) score++;
            if (numbers.checked) score++;
            if (symbols.checked) score++;


            let strength;
            let activeBars;


            if (score <= 2) {

                strength = "Weak";
                activeBars = 1;

            } else if (score <= 4) {

                strength = "Medium";
                activeBars = 2;

            } else if (score <= 5) {

                strength = "Strong";
                activeBars = 3;

            } else {

                strength = "Very Strong";
                activeBars = 4;

            }


            strengthText.textContent = strength;


            // Reset bars

            strengthBars.forEach((bar, index) => {

                if (index < activeBars) {

                    bar.style.background =
                        "var(--text)";

                } else {

                    bar.style.background =
                        "var(--border)";

                }

            });

        }


        // ==============================
        // LENGTH DISPLAY
        // ==============================

        lengthSlider.addEventListener("input", () => {

            lengthValue.textContent =
                lengthSlider.value;

            updateStrength();

            generatePassword();

        });


        // ==============================
        // OPTION CHANGES
        // ==============================

        [
            uppercase,
            lowercase,
            numbers,
            symbols
        ].forEach((option) => {

            option.addEventListener("change", () => {

                updateStrength();

                generatePassword();

            });

        });


        // ==============================
        // GENERATE BUTTON
        // ==============================

        generateButton.addEventListener(
            "click",
            generatePassword
        );


        // ==============================
        // COPY PASSWORD
        // ==============================

        copyButton.addEventListener("click", async () => {

            if (!passwordInput.value) return;


            try {

                await navigator.clipboard.writeText(
                    passwordInput.value
                );


                copyMessage.textContent =
                    "✓ Password copied to clipboard!";


                setTimeout(() => {

                    copyMessage.textContent = "";

                }, 2500);


            } catch (error) {

                copyMessage.textContent =
                    "Unable to copy password.";

            }

        });


        // ==============================
        // START
        // ==============================

        generatePassword();

    </script>

</body>

</html>
