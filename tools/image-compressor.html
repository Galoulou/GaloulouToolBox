<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Compressor - Galoulou Toolbox</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.tool-page {
    min-height: 100vh;
    padding: 80px 20px;
}

.tool-container {
    max-width: 800px;
    margin: auto;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: var(--text-secondary);

    margin-bottom: 50px;
}

.tool-header {
    text-align: center;
    margin-bottom: 45px;
}

.tool-header h1 {
    font-size: clamp(40px, 7vw, 70px);
    letter-spacing: -3px;
    margin-bottom: 12px;
}

.tool-header p {
    color: var(--text-secondary);
    font-size: 17px;
}

.compressor-card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 35px;
}

.file-zone {

    background: var(--bg-secondary);

    border: 1px dashed var(--border-hover);

    border-radius: 14px;

    padding: 32px;

    text-align: center;

    cursor: pointer;

    margin-bottom: 30px;
}

.file-zone i {

    font-size: 30px;

    margin-bottom: 10px;
}

.file-zone p {

    color: var(--text-secondary);

    font-size: 13px;
}

.file-zone input {
    display: none;
}

.quality-head {

    display: flex;

    justify-content: space-between;

    margin-bottom: 12px;

    font-size: 14px;

    font-weight: 600;
}

.quality-value {
    color: var(--text-secondary);
}

#quality {

    width: 100%;

    accent-color: var(--text);

    margin-bottom: 30px;
}

.compress-button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 11px;

    background: var(--button);

    color: var(--button-text);

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

.stats {

    margin-top: 20px;

    padding: 20px;

    background: var(--bg-secondary);

    border: 1px solid var(--border);

    border-radius: 14px;

    text-align: center;
}

.stats strong {

    font-size: 20px;
}

.download {

    display: none;

    align-items: center;

    justify-content: center;

    margin-top: 12px;

    padding: 15px;

    border-radius: 11px;

    background: var(--bg-secondary);

    border: 1px solid var(--border);

    font-weight: 700;
}

@media (max-width:600px) {

    .tool-page {
        padding: 55px 16px;
    }

    .compressor-card {
        padding: 22px;
    }

}

</style>

</head>


<body>

<header class="navbar">

<a href="../index.html" class="logo">

<img src="../assets/galouloutoolbox.png">

<span>Boîte à outils Galoulou</span>

</a>

<a href="../index.html#tools"
class="discord-button">

<i class="fa-solid fa-arrow-left"></i>

Tous les outils

</a>

</header>


<main class="tool-page">

<div class="tool-container">

<a href="../index.html"
class="back-button">

<i class="fa-solid fa-arrow-left"></i>

Retour à la boîte à outils

</a>


<div class="tool-header">

<h1>🗜️ Image Compressor</h1>

<p>
Réduisez le poids de vos images directement dans votre navigateur.
</p>

</div>


<div class="compressor-card">

<label class="file-zone">

<i class="fa-regular fa-image"></i>

<p>
Cliquez ici pour choisir une image
</p>

<input
type="file"
id="file"
accept="image/*">

</label>


<div class="quality-head">

<span>
Qualité
</span>

<span
class="quality-value"
id="qualityValue">
75%
</span>

</div>


<input
type="range"
id="quality"
min="10"
max="100"
value="75">


<button
class="compress-button"
onclick="compress()">

<i class="fa-solid fa-compress"></i>

&nbsp; Compresser l'image

</button>


<div
class="stats"
id="stats">

Choisissez une image pour commencer.

</div>


<a
id="download"
class="download">

<i class="fa-solid fa-download"></i>

&nbsp; Télécharger l'image

</a>

</div>

</div>

</main>


<script>

const quality =
document.getElementById("quality");


quality.addEventListener("input", function() {

document.getElementById("qualityValue")
.textContent =
this.value + "%";

});


function compress() {

const file =
document.getElementById("file")
.files[0];


if (!file) {

document.getElementById("stats")
.textContent =
"❌ Choisissez une image.";

return;

}


const reader =
new FileReader();


reader.onload = function(event) {

const image =
new Image();


image.onload = function() {

const canvas =
document.createElement("canvas");


canvas.width =
image.width;

canvas.height =
image.height;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
image,
0,
0
);


canvas.toBlob(function(blob) {

const oldSize =
file.size;

const newSize =
blob.size;


const percent =
Math.max(
0,
((oldSize - newSize) /
oldSize) * 100
);


document.getElementById("stats")
.innerHTML = `

<strong>
${(newSize / 1024).toFixed(1)} KB
</strong>

<br>

<small>
Avant : ${(oldSize / 1024).toFixed(1)} KB
<br>
Économie : ${percent.toFixed(1)}%
</small>

`;


const url =
URL.createObjectURL(blob);


const download =
document.getElementById("download");


download.href = url;

download.download =
"galoulou-compressed.jpg";

download.style.display =
"flex";


}, "image/jpeg",
quality.value / 100);

};


image.src =
event.target.result;

};


reader.readAsDataURL(file);

}

</script>

</body>

</html>
